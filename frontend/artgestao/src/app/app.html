<div class="layout">

  <!-- ========================
       SIDEBAR
  ========================= -->

  <aside class="sidebar">

    <!-- LOGO -->
    <div class="sidebar-logo">
      <img src="logo.jpg" alt="Claudia Presentes e Artfestas" class="logo-img">
      <div class="logo-texto">
        <span class="logo-nome">ArtGestão</span>
        <span class="logo-sub">Painel Administrativo</span>
      </div>
    </div>

    <!-- DIVISOR -->
    <div class="sidebar-divisor"></div>

    <!-- MENU -->
    <nav class="menu">

      <p class="menu-label">Principal</p>

      <a routerLink="/temas" class="menu-item" routerLinkActive="menu-item-ativo">
        <span class="menu-icone">🎨</span>
        <span class="menu-texto">Temas</span>
      </a>

      <a routerLink="/produtos" class="menu-item" routerLinkActive="menu-item-ativo">
        <span class="menu-icone">📦</span>
        <span class="menu-texto">Produtos</span>
      </a>

      <a routerLink="/agenda" class="menu-item" routerLinkActive="menu-item-ativo">
        <span class="menu-icone">📅</span>
        <span class="menu-texto">Agenda</span>
      </a>

      <a routerLink="/vendas" class="menu-item" routerLinkActive="menu-item-ativo">
        <span class="menu-icone">💰</span>
        <span class="menu-texto">Vendas</span>
      </a>

    </nav>

    <!-- RODAPÉ DA SIDEBAR -->
    <div class="sidebar-footer">
      <div class="sidebar-footer-info">
        <span class="sidebar-footer-icone">🎉</span>
        <div>
          <span class="sidebar-footer-nome">Claudia</span>
          <span class="sidebar-footer-papel">Administradora</span>
        </div>
      </div>
    </div>

  </aside>


  <!-- ========================
       CONTEÚDO PRINCIPAL
  ========================= -->

  <div class="conteudo">

    <!-- TOPBAR -->
    <header class="topbar">

      <div class="topbar-titulo"></div>

      <div class="topbar-acoes">

        <div class="topbar-badge">
          <span class="topbar-badge-icone">🎪</span>
          <span class="topbar-badge-texto">Artfestas 232</span>
        </div>

        <div class="topbar-usuario">
          <div class="avatar">C</div>
          <div class="usuario-info">
            <span class="usuario-nome">Claudia</span>
            <span class="usuario-papel">Administradora</span>
          </div>
        </div>

      </div>

    </header>

    <!-- PÁGINA -->
    <main class="pagina">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
